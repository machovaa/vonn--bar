<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Posoudit vůni</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container d-flex justify-content-center mt-5">

<div class="card p-4 col-lg-6">

<h2 class="mb-4">Posoudit vůni</h2>

<form>

<div class="mb-3">
<label class="form-label">Název vůně</label>
<input type="text" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Typ vůně</label>

<select class="form-select">
<option>květinová</option>
<option>ovocná</option>
<option>kořeněná</option>
<option>experimentální</option>
</select>

</div>

<div class="mb-3">
<label class="form-label">Datum vytvoření</label>
<input type="date" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Intenzita vůně</label>
<input type="range" class="form-range" min="0" max="100">
</div>

<div class="mb-3">
<label class="form-label">Barva vůně</label>
<input type="color" class="form-control form-control-color">
</div>

<div class="mb-3">
<label class="form-label">Kód vzorku</label>
<input type="text" class="form-control" placeholder="VB-123A">
</div>

<div class="mb-3">
<label class="form-label">Obrázek vzorku</label>
<input type="file" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Email znovu</label>
<input type="email" class="form-control" required>
</div>

<button type="reset" class="btn btn-secondary">
Reset
</button>

<button type="submit" class="btn btn-primary">
Odeslat
</button>

</form>

</div>

</div>

</body>
</html>
